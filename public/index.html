<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Light and dark: the browser draws its own scrollbars, form controls and overscroll to match. -->
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!--
      SplitIt's copy of Expo's SPA template (web.output "single" uses public/index.html when it
      exists; app/+html.tsx only applies to static output). The only additions are the color-scheme
      meta above and the page background below, so the first paint, the browser's overscroll and
      its toolbar tint match the app instead of flashing white in dark mode.
      The two colors are colors.light.background and colors.dark.background in lib/theme.ts;
      __tests__/webTemplate.test.ts fails if they drift.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="splitit-background">
      html,
      body {
        background-color: #F3F4F6;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0B0F14;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
